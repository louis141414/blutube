<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch · Blutube</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="yt-header">
    <div class="header-left">
      <button class="menu-btn" aria-label="Menu">☰</button>
      <a href="index.html" class="logo">
        <span class="logo-icon">▶</span>
        <span class="logo-text">Blutube</span>
      </a>
    </div>

    <div class="header-center">
      <div class="search-box">
        <input type="search" placeholder="Search" />
        <button class="search-btn" aria-label="Search">🔍</button>
      </div>
    </div>

    <div class="header-right">
      <button class="icon-btn">＋</button>
      <button class="icon-btn">🔔</button>
      <div class="avatar">B</div>
    </div>
  </header>

  <div class="watch-layout">
    <div class="watch-main">
      <div class="player-wrap">
        <video id="player" controls playsinline preload="metadata"></video>
      </div>

      <h1 class="watch-title" id="title">Loading…</h1>

      <div class="watch-meta-row">
        <div class="channel-info">
          <div class="channel-avatar large" id="channelAvatar">B</div>
          <div>
            <p class="channel-name" id="channelName">Channel</p>
            <p class="subs" id="subs">1.2K subscribers</p>
          </div>
          <button class="subscribe-btn">Subscribe</button>
        </div>

        <div class="action-btns">
          <button class="action-btn">👍 Like</button>
          <button class="action-btn">👎</button>
          <button class="action-btn">↗ Share</button>
        </div>
      </div>

      <div class="description-box">
        <p class="views-date" id="viewsDate"></p>
        <p id="description"></p>
      </div>
    </div>

    <aside class="watch-sidebar" id="related">
      <!-- Related videos filled by JS -->
    </aside>
  </div>

  <script src="videos.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id") || "demo";
    const video = window.BLUTUBE_VIDEOS.find(v => v.id === id) || window.BLUTUBE_VIDEOS[0];

    document.getElementById("title").textContent = video.title;
    document.getElementById("description").textContent = video.description || "";
    document.getElementById("channelName").textContent = video.channel;
    document.getElementById("channelAvatar").textContent = video.channel.charAt(0);
    document.getElementById("viewsDate").textContent = `${video.views} · ${video.uploaded}`;
    document.title = video.title + " · Blutube";

    const player = document.getElementById("player");
    player.src = video.src || "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4";

    // Related videos (exclude current)
    const related = window.BLUTUBE_VIDEOS.filter(v => v.id !== video.id);
    document.getElementById("related").innerHTML = related.map(v => `
      <a class="related-card" href="watch.html?id=${v.id}">
        <div class="related-thumb">
          <img src="${v.thumbnail}" alt="" />
          <span class="duration">${v.duration}</span>
        </div>
        <div class="related-meta">
          <h4>${v.title}</h4>
          <p>${v.channel}</p>
          <p>${v.views} · ${v.uploaded}</p>
        </div>
      </a>
    `).join("");
  </script>
</body>
</html>
