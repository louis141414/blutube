<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch · Blutube</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a href="index.html" class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="28" height="28">
            <defs>
              <linearGradient id="btGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#5b8cff"/>
                <stop offset="100%" stop-color="#8b5cf6"/>
              </linearGradient>
            </defs>
            <rect width="32" height="32" rx="8" fill="url(#btGrad)"/>
            <path d="M12 9v14l12-7z" fill="white"/>
          </svg>
        </span>
        <span class="brand-text">Blutube</span>
      </a>
    </div>
    <div class="topbar-center">
      <div class="search">
        <input type="search" placeholder="Search" disabled />
        <button class="search-btn" aria-label="Search" id="searchBtn"></button>
      </div>
    </div>
    <div class="topbar-right">
      <a href="admin.html" class="icon-btn" title="Admin" id="adminLink"></a>
      <div class="avatar">B</div>
    </div>
  </header>

  <div class="watch-shell">
    <div class="watch-primary">
      <div class="player">
        <video id="player" controls playsinline preload="metadata"></video>
      </div>
      <h1 class="w-title" id="title">Loading…</h1>
      <div class="w-actions">
        <div class="w-channel">
          <div class="ch-avatar lg" id="chAvatar">?</div>
          <div>
            <p class="ch-name" id="chName">—</p>
            <p class="ch-sub">Channel</p>
          </div>
          <button class="btn-sub">Subscribe</button>
        </div>
        <div class="w-btns">
          <button class="btn-pill" id="likeBtn"></button>
          <button class="btn-pill" id="dislikeBtn"></button>
          <button class="btn-pill" id="shareBtn"></button>
        </div>
      </div>
      <div class="w-desc">
        <p class="w-stats" id="stats"></p>
        <p id="desc"></p>
      </div>
    </div>
    <aside class="watch-related" id="related"></aside>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/store.js"></script>
  <script>
    document.getElementById("searchBtn").innerHTML = icon("search");
    document.getElementById("adminLink").innerHTML = icon("settings");
    document.getElementById("likeBtn").innerHTML = icon("thumbsUp") + " Like";
    document.getElementById("dislikeBtn").innerHTML = icon("thumbsDown");
    document.getElementById("shareBtn").innerHTML = icon("share") + " Share";

    function escapeHtml(s) {
      return String(s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    async function init() {
      const videos = await BlutubeStore.load();
      const id = new URLSearchParams(location.search).get("id");
      const video = videos.find(v => v.id === id) || videos[0];
      if (!video) {
        document.getElementById("title").textContent = "Video not found";
        return;
      }

      document.title = video.title + " · Blutube";
      document.getElementById("title").textContent = video.title;
      document.getElementById("desc").textContent = video.description || "";
      document.getElementById("chName").textContent = video.channel || "Unknown";
      document.getElementById("chAvatar").textContent = (video.channel || "?").charAt(0);
      document.getElementById("stats").textContent = `${video.views || ""} · ${video.uploaded || ""}`;

      const player = document.getElementById("player");
      player.src = video.src || "";

      document.getElementById("shareBtn").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(location.href);
          alert("Link copied");
        } catch {
          prompt("Copy this link:", location.href);
        }
      });

      const related = videos.filter(v => v.id !== video.id);
      document.getElementById("related").innerHTML = related.map(v => `
        <a class="rel" href="watch.html?id=${encodeURIComponent(v.id)}">
          <div class="rel-thumb">
            <img src="${v.thumbnail}" alt="" />
            <span class="dur">${escapeHtml(v.duration)}</span>
          </div>
          <div class="rel-meta">
            <h4>${escapeHtml(v.title)}</h4>
            <p>${escapeHtml(v.channel)}</p>
            <p>${escapeHtml(v.views)} · ${escapeHtml(v.uploaded)}</p>
          </div>
        </a>
      `).join("");
    }

    init().catch(console.error);
  </script>
</body>
</html>
