<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blutube</title>
  <meta name="description" content="Blutube – your video platform" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" id="menuBtn" aria-label="Menu"></button>
      <a href="index.html" class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="28" height="28">
            <defs>
              <linearGradient id="btGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#5b8cff"/>
                <stop offset="100%" stop-color="#8b5cf6"/>
              </linearGradient>
            </defs>
            <rect width="32" height="32" rx="8" fill="url(#btGrad)"/>
            <path d="M12 9v14l12-7z" fill="white"/>
          </svg>
        </span>
        <span class="brand-text">Blutube</span>
      </a>
    </div>

    <div class="topbar-center">
      <div class="search">
        <input type="search" id="searchInput" placeholder="Search videos" autocomplete="off" />
        <button class="search-btn" id="searchBtn" aria-label="Search"></button>
      </div>
    </div>

    <div class="topbar-right">
      <a href="admin.html" class="icon-btn" title="Admin" id="adminLink"></a>
      <button class="icon-btn" title="Notifications" id="bellBtn"></button>
      <div class="avatar" title="You">B</div>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <a href="index.html" class="nav-item active" data-icon="home"><span class="nav-label">Home</span></a>
      <a href="#" class="nav-item" data-icon="fire"><span class="nav-label">Trending</span></a>
      <a href="#" class="nav-item" data-icon="subscriptions"><span class="nav-label">Subscriptions</span></a>
      <div class="nav-line"></div>
      <a href="#" class="nav-item" data-icon="library"><span class="nav-label">Library</span></a>
      <a href="#" class="nav-item" data-icon="history"><span class="nav-label">History</span></a>
      <a href="admin.html" class="nav-item" data-icon="admin"><span class="nav-label">Admin</span></a>
    </aside>

    <main class="main">
      <div class="chips" id="chips"></div>
      <section class="grid" id="videoGrid">
        <p class="loading">Loading videos…</p>
      </section>
    </main>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/store.js"></script>
  <script>
    // Inject icons
    document.getElementById("menuBtn").innerHTML = icon("menu");
    document.getElementById("searchBtn").innerHTML = icon("search");
    document.getElementById("adminLink").innerHTML = icon("settings");
    document.getElementById("bellBtn").innerHTML = icon("bell");
    document.querySelectorAll(".nav-item").forEach(el => {
      const name = el.dataset.icon;
      el.insertAdjacentHTML("afterbegin", icon(name, "nav-icon"));
    });

    let allVideos = [];

    function uniqueCategories(videos) {
      const set = new Set(videos.map(v => v.category || "All"));
      return ["All", ...[...set].filter(c => c !== "All")];
    }

    function renderChips(categories, active = "All") {
      document.getElementById("chips").innerHTML = categories.map(c =>
        `<button class="chip ${c === active ? "active" : ""}" data-cat="${c}">${c}</button>`
      ).join("");
      document.querySelectorAll(".chip").forEach(btn => {
        btn.addEventListener("click", () => {
          const cat = btn.dataset.cat;
          renderChips(categories, cat);
          filterAndRender(document.getElementById("searchInput").value, cat);
        });
      });
    }

    function cardHTML(v) {
      return `
        <a class="card" href="watch.html?id=${encodeURIComponent(v.id)}">
          <div class="thumb">
            <img src="${v.thumbnail}" alt="" loading="lazy" />
            <span class="dur">${v.duration || ""}</span>
          </div>
          <div class="card-row">
            <div class="ch-avatar">${(v.channel || "?").charAt(0)}</div>
            <div class="card-info">
              <h3>${escapeHtml(v.title)}</h3>
              <p>${escapeHtml(v.channel || "")}</p>
              <p>${escapeHtml(v.views || "")} · ${escapeHtml(v.uploaded || "")}</p>
            </div>
          </div>
        </a>`;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function filterAndRender(query = "", category = "All") {
      const q = query.toLowerCase().trim();
      let list = allVideos;
      if (category && category !== "All") {
        list = list.filter(v => (v.category || "") === category);
      }
      if (q) {
        list = list.filter(v =>
          (v.title || "").toLowerCase().includes(q) ||
          (v.channel || "").toLowerCase().includes(q) ||
          (v.description || "").toLowerCase().includes(q)
        );
      }
      const grid = document.getElementById("videoGrid");
      grid.innerHTML = list.length
        ? list.map(cardHTML).join("")
        : `<p class="empty">No videos found.</p>`;
    }

    async function init() {
      try {
        allVideos = await BlutubeStore.load();
        renderChips(uniqueCategories(allVideos));
        filterAndRender();
      } catch (e) {
        document.getElementById("videoGrid").innerHTML =
          `<p class="empty">Failed to load data/videos.json</p>`;
        console.error(e);
      }
    }

    document.getElementById("searchInput").addEventListener("input", (e) => {
      const active = document.querySelector(".chip.active")?.dataset.cat || "All";
      filterAndRender(e.target.value, active);
    });

    init();
  </script>
</body>
</html>
