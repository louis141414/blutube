<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blutube</title>
  <meta name="description" content="Blutube – your video platform" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Top bar -->
  <header class="yt-header">
    <div class="header-left">
      <button class="menu-btn" aria-label="Menu">☰</button>
      <a href="index.html" class="logo">
        <span class="logo-icon">▶</span>
        <span class="logo-text">Blutube</span>
      </a>
    </div>

    <div class="header-center">
      <div class="search-box">
        <input type="search" placeholder="Search" id="searchInput" />
        <button class="search-btn" aria-label="Search">🔍</button>
      </div>
    </div>

    <div class="header-right">
      <button class="icon-btn" title="Create">＋</button>
      <button class="icon-btn" title="Notifications">🔔</button>
      <div class="avatar" title="Account">B</div>
    </div>
  </header>

  <div class="layout">
    <!-- Mini sidebar -->
    <aside class="sidebar">
      <a href="index.html" class="side-item active">
        <span class="side-icon">🏠</span>
        <span>Home</span>
      </a>
      <a href="#" class="side-item">
        <span class="side-icon">🔥</span>
        <span>Trending</span>
      </a>
      <a href="#" class="side-item">
        <span class="side-icon">📺</span>
        <span>Subscriptions</span>
      </a>
      <div class="side-divider"></div>
      <a href="#" class="side-item">
        <span class="side-icon">📚</span>
        <span>Library</span>
      </a>
      <a href="#" class="side-item">
        <span class="side-icon">⏱</span>
        <span>History</span>
      </a>
    </aside>

    <!-- Main content -->
    <main class="content">
      <div class="chips">
        <button class="chip active">All</button>
        <button class="chip">Music</button>
        <button class="chip">Gaming</button>
        <button class="chip">Live</button>
        <button class="chip">News</button>
        <button class="chip">Learning</button>
      </div>

      <section class="video-grid" id="videoGrid">
        <!-- Cards are generated by videos.js -->
      </section>
    </main>
  </div>

  <script src="videos.js"></script>
  <script>
    // Render video cards
    function renderVideos(list) {
      const grid = document.getElementById("videoGrid");
      grid.innerHTML = list.map(v => `
        <a class="video-card" href="watch.html?id=${v.id}">
          <div class="thumb">
            <img src="${v.thumbnail}" alt="" loading="lazy" />
            <span class="duration">${v.duration}</span>
          </div>
          <div class="card-body">
            <div class="channel-avatar">${v.channel.charAt(0)}</div>
            <div class="card-meta">
              <h3 class="title">${v.title}</h3>
              <p class="channel">${v.channel}</p>
              <p class="stats">${v.views} · ${v.uploaded}</p>
            </div>
          </div>
        </a>
      `).join("");
    }

    renderVideos(window.BLUTUBE_VIDEOS);

    // Simple search filter
    document.getElementById("searchInput").addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase().trim();
      const filtered = window.BLUTUBE_VIDEOS.filter(v =>
        v.title.toLowerCase().includes(q) || v.channel.toLowerCase().includes(q)
      );
      renderVideos(filtered);
    });
  </script>
</body>
</html>
